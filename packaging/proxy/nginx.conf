# Recommended LAN: nginx terminates TLS on 443.
# WireScope API stays unprivileged on 127.0.0.1:8000.
# Replace the hostname and certificate paths. Do not expose TCP 8000.
#
#   sudo install.sh --trust-proxy --bind-host 127.0.0.1
#
# Lab self-signed (default ssl_* paths):
#   python3 -m appliance tls-selfsigned --output-dir /etc/wirescope/tls
#
# Production Let's Encrypt (Debian/Ubuntu or Fedora):
#   certbot certonly --webroot -w /var/www/html -d wirescope.example
# then swap ssl_* to /etc/letsencrypt/live/wirescope.example/{fullchain,privkey}.pem
# Keep HTTP 80 only for ACME + redirect. Do not serve the GUI on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name wirescope.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wirescope.example;

    ssl_certificate     /etc/wirescope/tls/cert.pem;
    ssl_certificate_key /etc/wirescope/tls/key.pem;
    # Let's Encrypt:
    # ssl_certificate     /etc/letsencrypt/live/wirescope.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wirescope.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
