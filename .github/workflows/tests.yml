name: tests

on:
  push:
    branches:
      - milestone-*
      - v*
      - refactor/**
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile Python sources
        run: python -m compileall -q backend appliance config engine findings global_analysis inventory jobs parsers persistence protocol_audits providers reports storage traffic_analysis topology tests

      - name: Run default test suite
        run: pytest -q

      - name: Build wheel
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke-test installed wheel outside source tree
        run: |
          python -m venv /tmp/wirescope-wheel-venv
          /tmp/wirescope-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wirescope-wheel-venv/bin/python -m pip install dist/wirescope-*.whl
          cd /tmp
          /tmp/wirescope-wheel-venv/bin/python -c "import topology, global_analysis; from topology import build_topology; from global_analysis import build_global_analysis; print(topology.__file__); print(global_analysis.__file__)"
