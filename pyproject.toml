[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wirescope"
version = "0.1.0"
description = "Portable network discovery, diagnostics, and security audit appliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "scapy==2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "config*",
    "engine*",
    "inventory*",
    "jobs*",
    "parsers*",
    "persistence*",
    "protocol_audits*",
    "findings*",
    "reports*",
    "auth*",
    "appliance*",
    "providers*",
    "sensors*",
    "storage*",
]

[tool.setuptools.package-data]
inventory = ["data/oui.txt"]
reports = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "-m", "not network and not live_pi"]
markers = [
    "network: opt-in tests that may contact a live network",
    "integration: broader pipeline tests that still stay fixture-based unless also marked network",
    "browser: optional headless browser tests skipped when Playwright is unavailable",
    "live_pi: opt-in Raspberry Pi hardware extra; unused for generic Linux",
]
