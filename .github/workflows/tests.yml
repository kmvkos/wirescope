name: tests

on:
  push:
    branches:
      - milestone-8-appliance
      - refactor/**
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q backend appliance config engine findings inventory jobs parsers persistence protocol_audits providers reports storage tests

      - name: Run default test suite
        run: pytest -q
