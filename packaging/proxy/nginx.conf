# Recommended LAN: nginx terminates TLS on 443.
# WireScope API stays unprivileged on 127.0.0.1:8000.
# Replace the hostname and certificate paths. Do not expose TCP 8000.
#
#   sudo install.sh --trust-proxy --bind-host 127.0.0.1

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wirescope.example;

    ssl_certificate     /etc/wirescope/tls/cert.pem;
    ssl_certificate_key /etc/wirescope/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
